[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "negative-restoration"
version = "0.1.0"
description = "Negative Restoration via the Heterogeneity of Channel-Induced Geometric Features"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
license-files = ["third_party/*LICENSE", "third_party/NOTICE.md"]

[tool.setuptools.packages.find]
include = ["negative_restoration*"]
